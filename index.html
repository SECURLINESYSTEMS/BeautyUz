<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BeautyUz — Найди своего мастера</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --primary:#e85d8c;
  --primary-dark:#cf3f70;
  --dark:#25212a;
  --gray:#777;
  --light:#faf7f8;
  --white:#fff;
  --border:#eee;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}

body{
  font-family:Arial,sans-serif;
  background:var(--light);
  color:var(--dark);
  padding-bottom:85px;
}

button,input,textarea{
  font-family:inherit;
}

button{cursor:pointer}

.container{
  max-width:1100px;
  margin:auto;
  padding:0 18px;
}

/* HEADER */

header{
  height:68px;
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:100;
}

.header-content{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:26px;
  font-weight:800;
  color:var(--primary);
  cursor:pointer;
}

.city{
  background:#fff0f5;
  padding:9px 14px;
  border-radius:20px;
  color:var(--primary);
  font-size:14px;
}

/* PAGES */

.page{display:none}
.page.active{display:block}

/* HERO */

.hero{
  padding:30px 0 10px;
}

.hero h1{
  font-size:32px;
  margin-bottom:10px;
}

.hero p{
  color:var(--gray);
  line-height:1.5;
}

.search-box{
  display:flex;
  background:#fff;
  border-radius:18px;
  padding:7px;
  margin-top:22px;
  box-shadow:var(--shadow);
}

.search-box input{
  flex:1;
  border:none;
  outline:none;
  padding:14px;
  font-size:15px;
}

.search-btn{
  border:none;
  background:var(--primary);
  color:#fff;
  border-radius:14px;
  padding:0 20px;
}

/* SECTIONS */

.section{
  margin-top:32px;
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.section-header h2{
  font-size:21px;
}

.link-btn{
  border:none;
  background:none;
  color:var(--primary);
}

/* CATEGORIES */

.categories{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
}

.category{
  background:#fff;
  padding:16px 8px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 5px 20px rgba(0,0,0,.04);
  cursor:pointer;
}

.category-icon{
  font-size:27px;
  margin-bottom:7px;
}

.category p{
  font-size:12px;
  font-weight:bold;
}

/* SALONS */

.salons-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.salon-card{
  background:#fff;
  border-radius:20px;
  overflow:hidden;
  box-shadow:var(--shadow);
  position:relative;
  cursor:pointer;
}

.salon-image{
  height:180px;
  background-size:cover;
  background-position:center;
  background-color:#f1dce3;
}

.salon-info{
  padding:16px;
}

.salon-info h3{
  margin-bottom:8px;
}

.rating{
  color:#e69a16;
  font-size:14px;
  margin-bottom:7px;
}

.address{
  color:var(--gray);
  font-size:13px;
}

.price{
  color:var(--primary);
  font-weight:bold;
  margin-top:10px;
}

.categories-small{
  margin-top:10px;
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.tag{
  background:#fff0f5;
  color:var(--primary);
  padding:5px 8px;
  border-radius:12px;
  font-size:11px;
}

.favorite{
  position:absolute;
  top:12px;
  right:12px;
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:#fff;
  font-size:19px;
}

/* SEARCH */

.search-page{
  padding-top:25px;
}

.big-title{
  font-size:28px;
  margin-bottom:20px;
}

.search-input{
  width:100%;
  padding:17px;
  border-radius:16px;
  border:1px solid var(--border);
  outline:none;
  font-size:16px;
}

.filter-buttons{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:16px 0;
}

.filter{
  border:none;
  background:#fff;
  padding:11px 16px;
  border-radius:20px;
  white-space:nowrap;
}

.filter.active{
  background:var(--primary);
  color:#fff;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--gray);
}

.empty-icon{
  font-size:55px;
  margin-bottom:15px;
}

/* PROFILE */

.profile-card{
  background:#fff;
  padding:28px;
  border-radius:24px;
  box-shadow:var(--shadow);
  text-align:center;
  margin-top:25px;
}

.profile-avatar{
  width:85px;
  height:85px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ffe5ee;
  font-size:38px;
}

.profile-card h2{
  margin-top:15px;
}

.profile-card p{
  color:var(--gray);
  margin-top:7px;
}

.profile-menu{
  margin-top:20px;
  background:#fff;
  border-radius:20px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.profile-item{
  padding:18px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  cursor:pointer;
}

/* BUTTON */

.main-btn{
  width:100%;
  margin-top:20px;
  padding:16px;
  border:none;
  border-radius:15px;
  background:var(--primary);
  color:#fff;
  font-size:16px;
  font-weight:bold;
}

/* NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:75px;
  background:#fff;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
}

.nav-item{
  border:none;
  background:none;
  color:var(--gray);
  font-size:11px;
}

.nav-item.active{
  color:var(--primary);
  font-weight:bold;
}

.nav-icon{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:2000;
}

.modal.active{
  display:flex;
}

.modal-content{
  width:100%;
  max-width:650px;
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:28px 28px 0 0;
  padding:24px;
}

.close{
  float:right;
  border:none;
  background:#f3f3f3;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:20px;
}

.modal-image{
  width:100%;
  height:220px;
  border-radius:18px;
  background-size:cover;
  background-position:center;
  background-color:#f1dce3;
  margin:15px 0;
}

.service{
  display:flex;
  justify-content:space-between;
  padding:15px 0;
  border-bottom:1px solid var(--border);
}

.master-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}

.master-photo{
  width:55px;
  height:55px;
  border-radius:50%;
  background-size:cover;
  background-position:center;
  background-color:#f1dce3;
}

/* BOOKING */

.booking-option{
  padding:15px;
  border:1px solid var(--border);
  border-radius:14px;
  margin-top:10px;
  cursor:pointer;
}

.booking-option.selected{
  border-color:var(--primary);
  background:#fff4f7;
}

.options-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.option-btn{
  border:1px solid var(--border);
  background:#fff;
  padding:11px;
  border-radius:12px;
}

.option-btn.selected{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

/* FORMS */

.form-input{
  width:100%;
  padding:15px;
  border:1px solid var(--border);
  border-radius:14px;
  outline:none;
  margin-top:10px;
}

.form-label{
  display:block;
  margin-top:16px;
  font-weight:bold;
}

.auth-switch{
  text-align:center;
  margin-top:16px;
  color:var(--gray);
}

.auth-switch span{
  color:var(--primary);
  cursor:pointer;
  font-weight:bold;
}

/* BOOKINGS */

.booking-card{
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:var(--shadow);
  margin-bottom:15px;
}

.booking-status{
  display:inline-block;
  margin-top:12px;
  padding:7px 12px;
  border-radius:15px;
  background:#e7f8ec;
  color:#29934d;
  font-size:13px;
}

/* REVIEW */

.review{
  padding:15px 0;
  border-bottom:1px solid var(--border);
}

.review small{
  color:var(--gray);
}

/* TOAST */

.toast{
  position:fixed;
  top:85px;
  left:50%;
  transform:translateX(-50%);
  background:#25212a;
  color:#fff;
  padding:14px 20px;
  border-radius:14px;
  display:none;
  z-index:5000;
}

@media(max-width:700px){

  .hero h1{font-size:26px}

  .categories{
    grid-template-columns:repeat(3,1fr);
  }

  .salons-grid{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<header>
<div class="container header-content">
<div class="logo" onclick="showPage('home')">BeautyUz ✨</div>
<div class="city">📍 Ташкент</div>
</div>
</header>


<!-- ГЛАВНАЯ -->

<div id="home" class="page active">
<div class="container">

<div class="hero">
<h1>Найди своего идеального мастера ✨</h1>
<p>Салоны красоты, мастера и онлайн-запись в одном месте</p>

<div class="search-box">
<input id="homeSearch" placeholder="Салон, услуга или мастер...">
<button class="search-btn" onclick="goSearch()">🔍</button>
</div>
</div>

<div class="section">
<div class="section-header">
<h2>Популярные услуги</h2>
<button class="link-btn" onclick="showPage('search')">Все →</button>
</div>
<div class="categories" id="categories"></div>
</div>

<div class="section">
<div class="section-header">
<h2>⭐ Лучшие салоны</h2>
<button class="link-btn" onclick="showPage('search')">Все →</button>
</div>
<div class="salons-grid" id="homeSalons"></div>
</div>

</div>
</div>


<!-- ПОИСК -->

<div id="search" class="page">
<div class="container search-page">

<h1 class="big-title">Поиск 🔍</h1>

<input id="searchInput"
class="search-input"
placeholder="Поиск салона или услуги..."
oninput="renderSearch()">

<div class="filter-buttons" id="filters"></div>

<div class="salons-grid" id="searchResults"></div>

</div>
</div>


<!-- ЗАПИСИ -->

<div id="bookings" class="page">
<div class="container search-page">
<h1 class="big-title">Мои записи 📅</h1>
<div id="bookingsList"></div>
</div>
</div>


<!-- ИЗБРАННОЕ -->

<div id="favorites" class="page">
<div class="container search-page">
<h1 class="big-title">Избранное ❤️</h1>
<div class="salons-grid" id="favoritesList"></div>
</div>
</div>


<!-- ПРОФИЛЬ -->

<div id="profile" class="page">
<div class="container">
<div id="profileContent"></div>
</div>
</div>


<!-- НИЖНЕЕ МЕНЮ -->

<nav class="bottom-nav">

<button class="nav-item active" data-page="home" onclick="showPage('home')">
<span class="nav-icon">🏠</span>Главная
</button>

<button class="nav-item" data-page="search" onclick="showPage('search')">
<span class="nav-icon">🔍</span>Поиск
</button>

<button class="nav-item" data-page="bookings" onclick="showPage('bookings')">
<span class="nav-icon">📅</span>Записи
</button>

<button class="nav-item" data-page="favorites" onclick="showPage('favorites')">
<span class="nav-icon">❤️</span>Избранное
</button>

<button class="nav-item" data-page="profile" onclick="showPage('profile')">
<span class="nav-icon">👤</span>Профиль
</button>

</nav>


<!-- САЛОН -->

<div class="modal" id="salonModal">
<div class="modal-content">
<button class="close" onclick="closeModal('salonModal')">✕</button>
<div id="salonDetails"></div>
</div>
</div>


<!-- ЗАПИСЬ -->

<div class="modal" id="bookingModal">
<div class="modal-content">
<button class="close" onclick="closeModal('bookingModal')">✕</button>
<h2>Онлайн-запись 📅</h2>
<div id="bookingContent"></div>
</div>
</div>


<!-- АВТОРИЗАЦИЯ -->

<div class="modal" id="authModal">
<div class="modal-content">
<button class="close" onclick="closeModal('authModal')">✕</button>
<div id="authContent"></div>
</div>
</div>


<!-- ОТЗЫВ -->

<div class="modal" id="reviewModal">
<div class="modal-content">
<button class="close" onclick="closeModal('reviewModal')">✕</button>
<h2>Оставить отзыв ⭐</h2>
<div id="reviewContent"></div>
</div>
</div>


<div class="toast" id="toast"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* SUPABASE */

const SUPABASE_URL = "https://khultzywluakiadplgfm.supabase.co";

const SUPABASE_KEY = "sb_publishable_laISq9C5XCc32DhtP6UTpg_k7RW5ikc";

const supabase = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ДАННЫЕ */

let salons = [];
let categories = [];
let currentUser = null;

let currentFilter = "Все";

let selectedSalon = null;
let selectedService = null;
let selectedMaster = null;
let selectedDate = null;
let selectedTime = null;


/* ЗАПУСК */

async function startApp(){

try{

const {data:{session}} =
await supabase.auth.getSession();

currentUser = session?.user || null;

await loadCategories();
await loadSalons();

renderCategories();
renderFilters();
renderHome();
renderSearch();
renderProfile();

}catch(error){

console.error(error);
showToast("Ошибка загрузки данных");

}

}

startApp();


/* КАТЕГОРИИ */

async function loadCategories(){

const {data,error} =
await supabase
.from("beauty_categories")
.select("*")
.order("id");

if(error) throw error;

categories = data || [];

}


/* САЛОНЫ */

async function loadSalons(){

const {data,error} =
await supabase
.from("beauty_salons")
.select(`
id,
name,
description,
address,
city,
phone,
image_url,
beauty_salon_categories(
beauty_categories(
id,
name,
icon
)
)
`)
.order("id");

if(error) throw error;

salons = data || [];


for(const salon of salons){

const {data:servicesData} =
await supabase
.from("beauty_services")
.select("*")
.eq("salon_id",salon.id);

salon.services = servicesData || [];


const {data:reviewsData} =
await supabase
.from("beauty_reviews")
.select("rating")
.eq("salon_id",salon.id);

salon.reviews = reviewsData?.length || 0;

salon.rating =
reviewsData?.length
?
(
reviewsData.reduce(
(sum,r)=>sum+Number(r.rating),
0
)
/
reviewsData.length
).toFixed(1)
:
"Новый";


salon.categories =
(salon.beauty_salon_categories || [])
.map(x=>x.beauty_categories)
.filter(Boolean);

}

}


/* НАВИГАЦИЯ */

function showPage(page){

document.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document.getElementById(page)
.classList.add("active");


document.querySelectorAll(".nav-item")
.forEach(n=>n.classList.remove("active"));

const nav =
document.querySelector(`[data-page="${page}"]`);

if(nav) nav.classList.add("active");


if(page==="search") renderSearch();
if(page==="favorites") renderFavorites();
if(page==="bookings") renderBookings();
if(page==="profile") renderProfile();

window.scrollTo(0,0);

}


/* КАТЕГОРИИ */

function renderCategories(){

const container =
document.getElementById("categories");

container.innerHTML =
categories.map(category=>`

<div class="category"
onclick="categorySearch('${category.name}')">

<div class="category-icon">${category.icon}</div>

<p>${category.name}</p>

</div>

`).join("");

}


function renderFilters(){

const container =
document.getElementById("filters");

container.innerHTML = `

<button class="filter active"
onclick="setFilter('Все',this)">
Все
</button>

` +

categories.map(category=>`

<button class="filter"
onclick="setFilter('${category.name}',this)">

${category.icon} ${category.name}

</button>

`).join("");

}


function categorySearch(category){

showPage("search");

currentFilter = category;

renderSearch();

}


function setFilter(filter,button){

currentFilter = filter;

document.querySelectorAll(".filter")
.forEach(x=>x.classList.remove("active"));

if(button) button.classList.add("active");

renderSearch();

}


/* КАРТОЧКА САЛОНА */

function salonCard(salon){

const tags =
(salon.categories || [])
.slice(0,3)
.map(c=>`<span class="tag">${c.icon} ${c.name}</span>`)
.join("");


let price = "Цены уточняйте";

if(salon.services?.length){

const minPrice =
Math.min(
...salon.services.map(s=>Number(s.price))
);

price =
"от " +
minPrice.toLocaleString("ru-RU") +
" сум";

}


return `

<div class="salon-card"
onclick="openSalon(${salon.id})">

<button class="favorite"
onclick="event.stopPropagation();toggleFavorite(${salon.id})">

❤️

</button>

<div class="salon-image"
style="background-image:url('${salon.image_url || ""}')">
</div>

<div class="salon-info">

<h3>${salon.name}</h3>

<div class="rating">

⭐ ${salon.rating}
(${salon.reviews} отзывов)

</div>

<div class="address">

📍 ${salon.address || salon.city || "Ташкент"}

</div>

<div class="categories-small">

${tags}

</div>

<div class="price">

${price}

</div>

</div>

</div>

`;

}


/* ГЛАВНАЯ */

function renderHome(){

document.getElementById("homeSalons").innerHTML =
salons.slice(0,6)
.map(salonCard)
.join("");

}


/* ПОИСК */

function goSearch(){

const value =
document.getElementById("homeSearch").value;

showPage("search");

document.getElementById("searchInput").value =
value;

renderSearch();

}


function renderSearch(){

const input =
document.getElementById("searchInput");

if(!input) return;

const query =
input.value.toLowerCase();


const results =
salons.filter(salon=>{

const text =
[
salon.name || "",
salon.description || "",
...(salon.categories || []).map(c=>c.name),
...(salon.services || []).map(s=>s.name)
]
.join(" ")
.toLowerCase();


const matchSearch =
text.includes(query);


const matchFilter =
currentFilter==="Все" ||

(salon.categories || [])
.some(c=>c.name===currentFilter);


return matchSearch && matchFilter;

});


const container =
document.getElementById("searchResults");


if(!results.length){

container.innerHTML = `

<div class="empty">

<div class="empty-icon">🔍</div>

<h3>Ничего не найдено</h3>

<p>Попробуйте другой поиск</p>

</div>

`;

return;

}


container.innerHTML =
results.map(salonCard).join("");

}


/* САЛОН */

async function openSalon(id){

selectedSalon =
salons.find(s=>s.id===id);

if(!selectedSalon) return;


const {data:masters} =
await supabase
.from("beauty_masters")
.select("*")
.eq("salon_id",id);


const {data:reviews} =
await supabase
.from("beauty_reviews")
.select("*")
.eq("salon_id",id)
.order("created_at",{ascending:false});


const servicesHtml =
selectedSalon.services.map(service=>`

<div class="service">

<div>

<strong>${service.name}</strong>

<br>

<small>${service.duration || 60} минут</small>

</div>

<strong>
${Number(service.price).toLocaleString("ru-RU")} сум
</strong>

</div>

`).join("") ||
"<p>Услуги пока не добавлены</p>";


const mastersHtml =
(masters || []).map(master=>`

<div class="master-item">

<div class="master-photo"
style="background-image:url('${master.photo_url || ""}')">
</div>

<div>

<strong>${master.full_name}</strong>

<br>

<small>${master.specialization || ""}</small>

</div>

</div>

`).join("") ||
"<p>Мастера пока не добавлены</p>";


const reviewsHtml =
(reviews || []).map(review=>`

<div class="review">

<strong>⭐ ${review.rating}/5</strong>

<p>${review.comment || ""}</p>

<small>Пользователь</small>

function selectService(id){

selectedService =
selectedSalon.services.find(x=>x.id===id);

renderBooking();

}


async function selectMaster(id){

const {data} =
await supabase
.from("beauty_masters")
.select("*")
.eq("id",id)
.single();

selectedMaster = data;

renderBooking();

}


function selectDate(date){

selectedDate = date;

renderBooking();

}


function selectTime(time){

selectedTime = time;

renderBooking();

}


function getDates(){

const result=[];

for(let i=0;i<5;i++){

const date = new Date();

date.setDate(date.getDate()+i);

const value =
date.toISOString().split("T")[0];

const label =
i===0
? "Сегодня"
: i===1
? "Завтра"
: date.toLocaleDateString(
"ru-RU",
{day:"numeric",month:"short"}
);

result.push({value,label});

}

return result;

}


async function confirmBooking(){

if(
!selectedService ||
!selectedMaster ||
!selectedDate ||
!selectedTime
){

showToast("Заполните все пункты");

return;

const {error} =
await supabase
.from("beauty_bookings")
.insert({

client_id:currentUser.id,

salon_id:selectedSalon.id,

master_id:selectedMaster.id,

service_id:selectedService.id,

booking_date:selectedDate,

booking_time:selectedTime,

status:"confirmed"

});


if(error){

console.error(error);

showToast("Ошибка создания записи");

return;

}


closeModal("bookingModal");

showToast("Вы успешно записались! 🎉");

showPage("bookings");

}

/* АВТОРИЗАЦИЯ */

function openAuth(mode="login"){

document.getElementById("authModal")
.classList.add("active");

renderAuth(mode);

}


function renderAuth(mode){

const register =
mode==="register";


document.getElementById("authContent").innerHTML=`

<h2>
${register ? "Создать аккаунт" : "Вход"}
</h2>


${register ? `

<label class="form-label">
Ваше имя
</label>

<input id="authName"
class="form-input"
placeholder="Ваше имя">

` : ""}


<label class="form-label">
Email
</label>

<input id="authEmail"
class="form-input"
type="email"
placeholder="example@email.com">


<label class="form-label">
Пароль
</label>

<input id="authPassword"
class="form-input"
type="password"
placeholder="Минимум 6 символов">


<button class="main-btn"
onclick="${register ? "registerUser()" : "loginUser()"}">

${register ? "Зарегистрироваться" : "Войти"}

</button>


<div class="auth-switch">

${register

? `Уже есть аккаунт?
<span onclick="renderAuth('login')">
Войти
</span>`

: `Нет аккаунта?
<span onclick="renderAuth('register')">
Регистрация
</span>`

}

</div>

`;

}


async function registerUser(){

const name =
document.getElementById("authName").value.trim();

const email =
document.getElementById("authEmail").value.trim();

const password =
document.getElementById("authPassword").value;


if(!name || !email || !password){

showToast("Заполните все поля");

return;

}


const {data,error} =
await supabase.auth.signUp({

email,
password,

options:{
data:{
full_name:name
}
}

});


if(error){

showToast(error.message);

return;

}


if(data.user){

/* Создаём профиль */

await supabase
.from("beauty_profiles")
.upsert({

id:data.user.id,

full_name:name

});

}


showToast("Регистрация успешна! 🎉");


if(data.session){

currentUser = data.user;

closeModal("authModal");

renderProfile();

}else{

showToast("Проверьте email для подтверждения");

}

}


async function loginUser(){

const email =
document.getElementById("authEmail").value.trim();

const password =
document.getElementById("authPassword").value;


const {data,error} =
await supabase.auth.signInWithPassword({

email,
password

});


if(error){

showToast("Неверный email или пароль");

return;

}


currentUser = data.user;

closeModal("authModal");

showToast("Добро пожаловать! ✨");

renderProfile();

}

/* MODAL */

function closeModal(id){

document.getElementById(id)
.classList.remove("active");

}


/* TOAST */

function showToast(text){

const toast =
document.getElementById("toast");

toast.textContent = text;

toast.style.display = "block";

setTimeout(()=>{

toast.style.display = "none";

},3000);

}


/* ЗАКРЫТИЕ ПО ФОНУ */

window.addEventListener("click",event=>{

document.querySelectorAll(".modal")
.forEach(modal=>{

if(event.target===modal){

modal.classList.remove("active");

}

});

});

</script>
